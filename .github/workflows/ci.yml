name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Application
        run: |
          test -f app/index.html
          grep -q "AI Cloud DevOps Platform" app/index.html

      - name: Build Docker Image
        run: docker build -t ai-cloud-devops-platform:v1 .
